name: Android 2.0 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '2.0/2.0 - 7a57a2b/**'
      - '.github/workflows/android-2.0.yml'
  pull_request:
    paths:
      - '2.0/2.0 - 7a57a2b/**'
      - '.github/workflows/android-2.0.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: '2.0/2.0 - 7a57a2b'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            2.0/2.0 - 7a57a2b
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.1.5'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform and NDK
        run: sdkmanager 'platforms;android-28' 'build-tools;30.0.3' 'ndk;21.4.7075529'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned libraries
        run: |
          bash tools/install_android_deps.sh
          python -m pip install -r tools/requirements-android.txt
      - name: Test touch input and atlas conversion
        run: |
          bash tests/test-mobile-input.sh
          bash tests/test-gameplay-rules.sh
          python -m unittest discover -s tools -p 'test_prepare_android_assets.py'
      - name: Build signed debug APK
        run: |
          export ANDROID_SDK="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/21.4.7075529"
          bash tools/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VsDave-2.0-Android-debug
          path: '2.0/2.0 - 7a57a2b/export/debug/android/bin/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
